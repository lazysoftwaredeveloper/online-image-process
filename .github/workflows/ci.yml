name: CI

on:
  push:
    branches: [main, 'feat/**']
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run test
      - run: npm run build

  browser-e2e:
    name: Real browser inference (Chromium + WASM)
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run real browser model benchmark
        run: npm run test:e2e
      - name: Upload browser benchmark report and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cloud-browser-benchmark
          path: test-results/
          if-no-files-found: warn
          retention-days: 30
